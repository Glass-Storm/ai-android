## Version catalog for the on-device sign / ASR / TTS / translation library.
## Engine coordinates are pinned here and resolved by the root `engineResolution`
## configuration (see build.gradle.kts) so a broken entry fails fast with a clear error.

[versions]
# --- Build toolchain ---
agp = "8.13.0"
kotlin = "2.1.0"
ktlint = "12.1.2"
detekt = "1.23.8"

# --- SDK levels (also referenced from module build scripts) ---
# kept here as documentation; concrete values live in each module's android {} block
minSdk = "28"
compileSdk = "36"

# --- JSON (signed model manifest schema) ---
# Pure-JVM/Multiplatform, no native code. Kept in sync with the Kotlin 2.1.0 compiler plugin.
kotlinxSerialization = "1.7.3"

# --- Test stack ---
coroutines = "1.9.0"
junit = "4.13.2"
robolectric = "4.16.1"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

# --- Engine artifacts ---
# sherpa-onnx: NOT on Maven Central. JitPack resolves it only as an on-demand build,
# so it is VENDORED at libs/sherpa-onnx-1.13.8.aar (sha256 633c24321e06b1...d13bd96,
# per S4 decision P1). The AAR already bundles libonnxruntime.so — do NOT also add
# onnxruntime-android to a module that packages sherpa-onnx (duplicate .so).
sherpaOnnx = "1.13.8"
onnxruntime = "1.20.0"
opencc4j = "1.13.1"
litert = "1.4.2"
mediapipe = "0.10.26"
# NLLB tokenizer (translation module). Host/JVM SentencePiece JNI per the Wave-0 S1 recipe.
# NOTE: this artifact ships NO Android native (linux/macOS/Windows only) — see task-15 notepad
# for the Android tokenizer risk and the `ai.djl.android:tokenizer-native` alternative.
djlSentencepiece = "0.33.0"

[libraries]
# --- Coroutines ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# --- Test stack ---
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

# --- Engines ---
# sherpa-onnx AAR is vendored (see [versions]); resolved from libs/ as a file dependency.
# onnxruntime-android: AAR with Android native libs (com.microsoft.onnxruntime).
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
# OpenCC traditional/simplified conversion (pure-JVM).
opencc4j = { module = "com.github.houbb:opencc4j", version.ref = "opencc4j" }
# SentencePiece JNI used by the NLLB translation tokenizer (host JVM; no Android native).
djl-sentencepiece = { module = "ai.djl.sentencepiece:sentencepiece", version.ref = "djlSentencepiece" }
# LiteRT (successor of TFLite) Android runtime AAR.
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
# MediaPipe Tasks Vision (hand/holistic landmarks) — from Google Maven.
mediapipe-tasks-vision = { module = "com.google.mediapipe:tasks-vision", version.ref = "mediapipe" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
