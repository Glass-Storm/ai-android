# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Single source of truth for the published Maven coordinates. Every `publishedModules` project
# publishes `hk.edu.hkmu:<module>:<version>` to GitHub Packages; see docs/PUBLISHING.md.
# Setting `group` also makes inter-module project dependencies (e.g. `:core`) map to real
# `hk.edu.hkmu:core:<version>` coordinates in the generated POMs. Do NOT set these anywhere else.
group=hk.edu.hkmu
version=0.0.1-alpha.1
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX is mandatory (AndroidX Test + Robolectric + coroutines).
android.useAndroidX=true
# Non-transitive R classes keep the R surface small for a library.
android.nonTransitiveRClass=true

kotlin.code.style=official
